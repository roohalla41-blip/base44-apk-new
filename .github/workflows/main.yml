name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: تنظیم Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بررسی ساختار پروژه
        run: |
          echo "مسیر فعلی:"
          pwd
          echo ""
          echo "فایل‌های اصلی پروژه:"
          find . -maxdepth 3 -type f | sort | head -n 200

      - name: بررسی Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "خطا: فایل gradlew در ریشه پروژه پیدا نشد."
            echo "فایل‌های موجود:"
            find . -maxdepth 3 -type f -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts"
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: ساخت APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: پیدا کردن APK
        run: |
          echo "جستجوی فایل‌های APK..."
          find . -type f -name "*.apk" -print

      - name: آماده‌سازی APK
        run: |
          mkdir -p apk-output

          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "خطا: APK ساخته نشد و هیچ فایل APK پیدا نشد."
            exit 1
          fi

          echo "APK پیدا شد:"
          echo "$APK_FILE"

          cp "$APK_FILE" apk-output/app-debug.apk

          echo "APK برای آپلود آماده شد."

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/app-debug.apk
          if-no-files-found: error
