name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: تنظیم Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: اجازه اجرای Gradle
        run: chmod +x ./gradlew

      - name: ساخت APK
        run: ./gradlew assembleDebug

      - name: پیدا کردن فایل APK
        run: |
          echo "فایل‌های APK پیدا شده:"
          find . -type f -name "*.apk" -print

      - name: آماده‌سازی APK برای آپلود
        run: |
          mkdir -p apk-output
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "خطا: هیچ فایل APK پیدا نشد."
            exit 1
          fi

          echo "APK پیدا شد:"
          echo "$APK_FILE"

          cp "$APK_FILE" apk-output/app-debug.apk

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/app-debug.apk
          if-no-files-found: error
